# Configuration for Lab Webots Control Scenario

scenario: scenarios.lab_webots_control

agent:
  namespaces: ""  # Empty for global namespace, or set to robot namespace if needed
  behavior_tree_xml: "default_bt.xml"

bt_runner:
  bt_tick_rate: 10.0 
  bt_visualiser:
    enabled: True       # Set to True to enable BT visualisation, False to disable
    screen_width: 800 
    screen_height: 600 
    direction: "Vertical"  # or "Horizontal"
  profiling_mode: False